name: Aevoryn Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build Verification & Quality Assurance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Project Dependencies
        run: npm ci

      - name: Next.js Static Export Build
        run: npm run build

      - name: Verify Export Artifacts
        run: |
          test -f out/index.html || exit 1
          test -f out/about.html || exit 1
          test -f out/contact.html || exit 1
          test -f out/clients.html || exit 1
          test -f out/certifications.html || exit 1
          test -f out/aramco-registration.html || exit 1
          test -f out/qhse.html || exit 1
          echo "All static page routes successfully verified."

      - name: Verify Worker API TypeScript Compilation
        run: |
          cd worker
          npm run typecheck
          echo "Worker API TypeScript verification passed."

  deploy:
    name: Cloudflare Production Deployment
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Project Dependencies
        run: npm ci

      - name: Verify Cloudflare Authentication Secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error title=Missing Secret::CLOUDFLARE_API_TOKEN is not configured in GitHub repository secrets. Please configure it in GitHub Settings > Secrets and variables > Actions (https://github.com/buttsaqlain-15109/aevoryn-web2/settings/secrets/actions)."
            exit 1
          fi
          echo "Cloudflare deployment secrets verified."

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://aevoryn-api.smagencywire.workers.dev"

      - name: Deploy Frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '41dab4153cb7116c590fbd200392718a' }}
          wranglerVersion: "4"
          command: pages deploy out --project-name aevoryn-web --commit-dirty=true

      - name: Deploy Worker API Engine
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '41dab4153cb7116c590fbd200392718a' }}
          wranglerVersion: "4"
          workingDirectory: worker
          command: deploy --env=""
