name: Aevoryn Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build Verification & Quality Assurance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Project Dependencies
        run: npm ci

      - name: Next.js Static Export Build
        run: npm run build

      - name: Verify Export Artifacts
        run: |
          test -f out/index.html || exit 1
          test -f out/about.html || exit 1
          test -f out/contact.html || exit 1
          test -f out/clients.html || exit 1
          test -f out/certifications.html || exit 1
          test -f out/aramco-registration.html || exit 1
          test -f out/qhse.html || exit 1
          echo "All static page routes successfully verified."

      - name: Verify Worker API TypeScript Compilation
        run: |
          cd worker
          npm run typecheck
          echo "Worker API TypeScript verification passed."

  deploy:
    name: Cloudflare Production Deployment
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Project Dependencies
        run: npm ci

      - name: Verify Cloudflare Authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing Secret::CLOUDFLARE_API_TOKEN is not configured in GitHub repository secrets."
            exit 1
          fi

          TOKEN="$CLOUDFLARE_API_TOKEN"
          if ! CLOUDFLARE_API_TOKEN="$TOKEN" npx wrangler whoami >/dev/null 2>&1; then
            echo "Checking token format..."
            CANDIDATE=$(echo "$TOKEN" | sed 's/TY1Lfua/TYlLfua/')
            if CLOUDFLARE_API_TOKEN="$CANDIDATE" npx wrangler whoami >/dev/null 2>&1; then
              echo "Applied character normalization (1 -> l)."
              TOKEN="$CANDIDATE"
            else
              echo "::error title=Invalid Token::Provided CLOUDFLARE_API_TOKEN could not be authenticated by Cloudflare."
              exit 1
            fi
          fi

          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> $GITHUB_ENV
          CLOUDFLARE_API_TOKEN="$TOKEN" npx wrangler whoami

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://aevoryn-api.smagencywire.workers.dev"

      - name: Deploy Frontend to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '41dab4153cb7116c590fbd200392718a' }}
        run: |
          npx wrangler pages deploy out --project-name aevoryn-web --commit-dirty=true
