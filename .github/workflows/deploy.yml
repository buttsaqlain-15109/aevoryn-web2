name: Aevoryn Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build Verification & Quality Assurance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Project Dependencies
        run: npm ci

      - name: Next.js Static Export Build
        run: npm run build

      - name: Verify Export Artifacts
        run: |
          test -f out/index.html || exit 1
          test -f out/about.html || exit 1
          test -f out/contact.html || exit 1
          test -f out/clients.html || exit 1
          test -f out/certifications.html || exit 1
          test -f out/aramco-registration.html || exit 1
          test -f out/qhse.html || exit 1
          test -f out/documents.html || exit 1
          test -f out/supplier-registration.html || exit 1
          test -f out/admin/suppliers.html || exit 1
          echo "All static page routes successfully verified."

      - name: Verify Worker API TypeScript Compilation
        run: |
          cd worker
          npm run typecheck
          echo "Worker API TypeScript verification passed."

  deploy:
    name: Cloudflare Production Deployment
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Project Dependencies
        run: npm ci

      - name: Verify Cloudflare Authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 -c "
          import os, re, sys, hashlib

          raw = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          if not raw.strip():
              print('::error title=Missing Secret::CLOUDFLARE_API_TOKEN is empty in GitHub secrets.')
              sys.exit(1)

          token = raw.strip().strip('\"\'')
          h = hashlib.sha256(token.encode()).hexdigest()
          print(f'::notice title=Secret Validated::Token length: {len(token)}, SHA256: {h[:16]}...')

          github_env = os.environ.get('GITHUB_ENV')
          if github_env:
              with open(github_env, 'a') as f:
                f.write(f'CLOUDFLARE_API_TOKEN={token}\n')
          print('Cloudflare API Token exported to runner environment successfully.')
          "

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://aevoryn-api.smagencywire.workers.dev"

      - name: Deploy Frontend to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '41dab4153cb7116c590fbd200392718a' }}
        run: |
          ./node_modules/.bin/wrangler pages deploy out --project-name aevoryn-web --branch=main --commit-dirty=true
